AWSTemplateFormatVersion: '2010-09-09'
Description: Incident 9 controlled update failure from nonexistent security group
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
Resources:
  IncidentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Incident 9 isolated security group; Terraform does not own it
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 10.61.0.0/16
  DuplicateIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref IncidentSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp: 10.61.0.0/16
  MissingSourceIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref IncidentSecurityGroup
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8081
      SourceSecurityGroupId: sg-00000000000000000
